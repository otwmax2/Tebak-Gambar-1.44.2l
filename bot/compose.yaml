services:
  tebak-gambar:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /app/bot/runtime/game.sqlite
      ASSET_ROOT: /app/audit/decrypted-levels
    volumes:
      - game-data:/app/bot/runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Long polling: no publicly exposed ports, no reverse proxy required.
volumes:
  game-data:
